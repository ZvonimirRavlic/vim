onboarding = false

[ui.toast]
delivery = "system"

[theme]
# Matches WezTerm and nvim
name = "gruvbox"
auto_switch = false

# Layers: nvim = Space / Alt / Ctrl Alt h,l   herdr = Cmd Alt   WezTerm = Cmd Shift
# Cmd Alt keys are forwarded by WezTerm only while herdr runs in the tab (see ~/.wezterm.lua).
# The ctrl+b prefix defaults stay as a fallback; destructive actions are prefix-only.
[keys]
# No pane splits: h/l move between tabs, j/k between spaces (the sidebar), n/p between agents.
previous_tab = ["prefix+p", "cmd+alt+h"]
next_tab = ["prefix+n", "cmd+alt+l"]
next_workspace = "cmd+alt+j"
previous_workspace = "cmd+alt+k"
next_agent = "cmd+alt+n"
previous_agent = "cmd+alt+p"
switch_tab = ["prefix+1..9", "cmd+alt+1..9"]
new_tab = ["prefix+c", "cmd+alt+t"]
open_notification_target = ["prefix+o", "cmd+alt+o"]
workspace_picker = ["prefix+w", "cmd+alt+s"]
close_tab = ["prefix+shift+x", "cmd+alt+w"]
copy_mode = ["prefix+[", "cmd+alt+v"]

[[keys.command]]
key = "cmd+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
